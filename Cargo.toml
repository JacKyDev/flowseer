[package]
name = "flowseer"
version = "0.0.1"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.18.0"
futures = "0.3.31"
tabled = "0.20.0"
async-trait = "0.1.88"
colored = "3.0.0"

[dev-dependencies]
tokio-test = "0.4"
http = "0.2"
